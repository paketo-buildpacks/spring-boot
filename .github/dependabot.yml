---
version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
  allow:
  # Allow both direct and indirect updates for all packages
  - dependency-type: "all"
  # group all minor and patch dependency updates together
  groups:
    go-modules:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
  cooldown:
    default-days: 7
  ignore:
  # Temporary: remove once on libpak v2. github.com/imdario/mergo was renamed to dario.cat/mergo and its v1 tags fail to resolve.
  - dependency-name: "github.com/imdario/mergo"
- package-ecosystem: gomod
  directory: "/dependency/retrieval"
  schedule:
    interval: daily
  allow:
  # Allow both direct and indirect updates for all packages
  - dependency-type: "all"
  # group all minor and patch dependency updates together
  groups:
    go-modules:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
  cooldown:
    default-days: 7
