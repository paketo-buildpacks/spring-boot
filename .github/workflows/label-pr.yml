name: Set / Validate PR Labels
on:
  pull_request:
    branches:
    - main
    types:
    - synchronize
    - opened
    - reopened
    - labeled
    - unlabeled

concurrency:
  group: pr_labels_${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  autolabel:
    name: Ensure Minimal Semver Labels
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository to determine which files changed
      issues: write # add the semver label
      pull-requests: write # update the pull request's labels
    steps:
    - name: Check Minimal Semver Labels
      uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
      with:
        count: 1
        labels: semver:major, semver:minor, semver:patch
        mode: exactly
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Auto-label Semver
      # Pull requests from forks receive a read-only token, so they cannot be
      # auto-labeled. A maintainer must add the label to those pull requests.
      if: ${{ failure() && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: paketo-buildpacks/github-config/actions/pull-request/auto-semver-label@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
